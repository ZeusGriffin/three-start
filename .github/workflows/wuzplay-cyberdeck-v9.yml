name: Build Wuzplay Cyberdeck v9

on:
  push:
    branches: ["wuzplay-cyberdeck-v9"]
    paths:
      - ".github/workflows/wuzplay-cyberdeck-v9.yml"
      - "wuzplay-cyberdeck-v9/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lcd-dfu:
    runs-on: ubuntu-latest
    container: solosky/nrf52-sdk:latest

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v4

      - name: Clone matching Pixl.js firmware source
        shell: bash
        run: |
          git clone https://github.com/solosky/pixl.js.git upstream
          cd upstream
          git checkout 5cc2b49
          git submodule update --init --recursive

      - name: Apply Wuzplay Cyberdeck v9 patch
        shell: bash
        run: |
          python3 wuzplay-cyberdeck-v9/apply_patch.py upstream
          cp wuzplay-cyberdeck-v9/src/cyber_games.h upstream/fw/application/src/app/game/scene/cyber_games.h
          cp wuzplay-cyberdeck-v9/src/cyber_breakout.h upstream/fw/application/src/app/game/scene/cyber_breakout.h
          cp wuzplay-cyberdeck-v9/src/cyber_breakout.h upstream/fw/application/src/app/game/port/common/cyber_breakout.h
          cp wuzplay-cyberdeck-v9/src/cyber_breakout.c upstream/fw/application/src/app/game/port/common/cyber_breakout.c

          # Keep the core NFC card emulator/tag functions. Remove the large built-in
          # Amiibo database browser so the requested games fit in the nRF52 flash.
          sed -i '/&app_amiidb_info,/d' upstream/fw/application/src/core/mini_app_data.c

          # Keep only the compact requested game set. The imported upstream games
          # exceed this nRF52 target's flash/RAM budget.
          sed -i '/#include "tiny_lander.h"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/#include "tiny_invaders.h"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/#include "tiny_tris.h"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/#include "tiny_arkanoid.h"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/#include "cyber_games.h"/a #include "cyber_breakout.h"' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/SPACE RAID/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/"LANDER"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/"BLOCKS"/d' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i 's/tiny_arkanoid_run/cyber_breakout_run/' upstream/fw/application/src/app/game/scene/game_scene_game_list.c
          sed -i '/tiny_lander\/tiny_lander.c/d' upstream/fw/application/Makefile
          sed -i '/tiny_invaders\/tiny_invaders.c/d' upstream/fw/application/Makefile
          sed -i '/tiny_tris\/tiny_tris.c/d' upstream/fw/application/Makefile
          sed -i '/tiny_arkanoid\/tiny_arkanoid.c/d' upstream/fw/application/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/fw/application/Makefile')
          s = p.read_text()
          needle = '  $(PROJ_DIR)/app/game/port/common/cyber_games.c \\\n'
          addition = needle + '  $(PROJ_DIR)/app/game/port/common/cyber_breakout.c \\\n'
          if needle not in s:
              raise SystemExit('cyber_games.c Makefile entry not found')
          p.write_text(s.replace(needle, addition, 1))
          PY

      - name: Build LCD firmware and Nordic DFU package
        shell: bash
        run: |
          cd upstream/fw
          make all RELEASE=1 APP_VERSION=900 BOARD=LCD

      - name: Verify and stage installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp upstream/fw/_build/pixjs_ota_v900.zip artifact/01_INSTALL_WUZPLAY_CYBERDECK_V9_DFU_KEEP_ZIPPED.zip
          cp upstream/fw/_build/pixljs.hex artifact/pixljs_v9_application.hex
          cp upstream/fw/_build/pixljs_all.hex artifact/pixljs_v9_full_factory.hex
          cp wuzplay-cyberdeck-v9/BUILD_README.txt artifact/BUILD_README.txt

          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          p = Path("artifact/01_INSTALL_WUZPLAY_CYBERDECK_V9_DFU_KEEP_ZIPPED.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "DFU ZIP is corrupt"
              names = set(z.namelist())
              assert "manifest.json" in names, names
              manifest = json.loads(z.read("manifest.json"))
              app = manifest["manifest"]["application"]
              assert app["bin_file"] in names
              assert app["dat_file"] in names
              report = {
                  "zip": p.name,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "members": sorted(names),
                  "manifest_application": app,
                  "verification": "passed"
              }
          Path("artifact/DFU_VERIFICATION.json").write_text(json.dumps(report, indent=2))
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wuzplay_Cyberdeck_v9_LCD_DFU
          path: artifact/
          if-no-files-found: error
          retention-days: 30
